[package]
name = "benches"
description = "Gas and step benchmarks for the fixed package (not published)"
version.workspace = true
edition.workspace = true
cairo-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
publish = false

[dependencies]
fixed.workspace = true

[dev-dependencies]
snforge_std.workspace = true
assert_macros.workspace = true

[tool]
fmt.workspace = true
scarb.workspace = true

[scripts]
test = "snforge test"

# One integration-test crate per bench file. snforge's cost per test grows with the size of the
# compiled test program (58 tests: 28 s inside the 4 700-test crate, 1.3 s alone), so a single
# crate over `tests/lib.cairo` made `scripts/bench.py` ~12x slower (990 s vs 82 s). Explicit
# `[[test]]` targets replace the auto-detected the former `tests/lib.cairo` (deleted). `scripts/bench.py`
# fails when this list and `tests/bench_*.cairo` differ. `test-type = "integration"` gives each
# crate access to `benches::harness` / `benches::alt`.

[[test]]
name = "bench_exp"
source-path = "tests/bench_exp.cairo"
test-type = "integration"

[[test]]
name = "bench_fixed"
source-path = "tests/bench_fixed.cairo"
test-type = "integration"

[[test]]
name = "bench_trig"
source-path = "tests/bench_trig.cairo"
test-type = "integration"

[[test]]
name = "bench_wide"
source-path = "tests/bench_wide.cairo"
test-type = "integration"
