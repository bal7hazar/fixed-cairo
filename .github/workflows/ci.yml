name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt-lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
      - run: scarb fmt --check --workspace
      - run: scarb lint --workspace --test --deny-warnings
      # docs/API_PARITY.md must match the Cairo sources (regenerate with scripts/api_parity.py).
      - run: python3 scripts/api_parity.py --check
      # README gas tables must match gas/*.snap (regenerate with scripts/gas_tables.py).
      - run: python3 scripts/gas_tables.py --check

  test:
    name: Test ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [fixed, glam, glamx]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
      - uses: foundry-rs/setup-snfoundry@16e23ddd0e2845f38727c92f4b913a7b728cda9e # v6.0.0
      - run: scarb build -p ${{ matrix.package }}
      # Fuzz properties are compiled with runs: 128 for local runs; CI keeps a deterministic
      # 32-run smoke of every property so the job stays under the runner's time budget.
      - name: Test
        run: snforge test -p ${{ matrix.package }} --fuzzer-runs 32 --fuzzer-seed 1

  bench:
    name: Build, benches, gas snapshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
      - uses: foundry-rs/setup-snfoundry@16e23ddd0e2845f38727c92f4b913a7b728cda9e # v6.0.0
      - run: scarb build --workspace
      # Fails on any gas/step change that is not committed in gas/*.snap.
      - name: Check gas snapshots
        run: |
          set -o pipefail
          python3 scripts/bench.py check | tee gas_report.md
      - name: Publish gas report
        if: always()
        run: cat gas_report.md >> "$GITHUB_STEP_SUMMARY"

  golden:
    name: Golden vectors up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The stable Rust toolchain is preinstalled on ubuntu-latest.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            tools/refgen/target
          key: refgen-${{ runner.os }}-${{ hashFiles('tools/refgen/Cargo.lock') }}
      - name: Generator unit tests
        run: cargo test --locked --manifest-path tools/refgen/Cargo.toml
      # Fails when a committed packages/*/tests/golden_*.cairo differs from the generator output.
      - name: Check golden vectors
        run: cargo run --locked --manifest-path tools/refgen/Cargo.toml -- check

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
      - run: scarb doc --workspace --disable-remote-linking

  all-checks:
    name: All checks passed
    if: always()
    needs: [fmt-lint, test, bench, golden, docs]
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]] || \
             [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            exit 1
          fi
