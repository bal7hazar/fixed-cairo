# Golden vectors of `glam::affine2`, with glam-rs 0.33.8 `DAffine2` as the oracle.
# Oracles: tools/refgen/src/oracles/affine2.rs. Format: tools/refgen/README.md.
# Regenerate: cargo run --manifest-path tools/refgen/Cargo.toml -- gen affine2
#
# Exact layout, constructors, conversions, equality and assignment are covered by
# `tests/test_affine2.cairo`. These vectors cover the arithmetic and transcendental paths.

module = "affine2"
package = "glam"
imports = ["glam::affine2::Affine2Trait"]

[[function]]
name = "transform_point2"
call = "{0}.transform_point2({1})"
args = [{ type = "Affine2", min = -100.0, max = 100.0 }, { type = "Vec2", min = -100.0, max = 100.0 }]
ret = "Vec2"
cases = 10
tolerance = 1
justification = "one `dot2_add` fused kernel per component floors the exact two products plus translation once vs round to nearest: |diff| <= 1."
edges = [[[[1, 0], [0, 1], [3, -2]], [4, 5]], [[[0, 1], [-1, 0], [1, 2]], [1, 0]]]

[[function]]
name = "transform_vector2"
call = "{0}.transform_vector2({1})"
args = [{ type = "Affine2", min = -100.0, max = 100.0 }, { type = "Vec2", min = -100.0, max = 100.0 }]
ret = "Vec2"
cases = 8
tolerance = 1
justification = "one `dot2` fused kernel per component floors the exact sum of two products once vs round to nearest: |diff| <= 1."
edges = [[[[1, 0], [0, 1], [3, -2]], [4, 5]], [[[0, 1], [-1, 0], [1, 2]], [1, 0]]]

[[function]]
name = "mul"
call = "{0} * {1}"
args = [{ type = "Affine2", min = -100.0, max = 100.0 }, { type = "Affine2", min = -100.0, max = 100.0 }]
ret = "Affine2"
cases = 10
tolerance = 1
justification = "each linear element is one `dot2` and each translation element one `dot2_add`; each exact expression is floored once vs round to nearest: |diff| <= 1."
edges = [
    [[[1, 0], [0, 1], [0, 0]], [[1, 2], [3, 4], [5, 6]]],
    [[[0, 1], [-1, 0], [1, 2]], [[2, 0], [0, 3], [-1, 1]]],
]

[[function]]
name = "inverse"
call = "{0}.inverse()"
args = [{ type = "Affine2", constraint = "invertible", min_det = 1.0, min = -4.0, max = 4.0 }]
ret = "Affine2"
cases = 12
tolerance = 36
justification = "for |linear|,|translation| <= 4 and |det| >= 1: the determinant floor contributes <= |numerator|/det^2 <= 32 ULP to translation; its fused numerator floor contributes <= 1 ULP and the shared reciprocal multiply < 1 ULP, for < 34 ULP total; linear elements need < 6 ULP."
edges = [[[[1, 0], [0, 1], [0, 0]]], [[[2, 0], [0, 4], [3, -2]]], [[[0, 1], [-1, 0], [1, 2]]]]

[[function.panics]]
name = "singular"
args = [[[[1, 2], [2, 4], [5, 6]]]]
expected = "Affine2: singular"

[[function]]
name = "from_scale_angle_translation"
call = "Affine2Trait::from_scale_angle_translation({0}, {1}, {2})"
args = [{ type = "Vec2", min = -8.0, max = 8.0 }, { type = "Fixed", domain = "angle" }, { type = "Vec2", min = -8.0, max = 8.0 }]
ret = "Affine2"
cases = 8
tolerance = 20
justification = "sine/cosine are within 2 ULP, multiplied by |scale| <= 8 and floored once: <= 17 ULP; translation is exact."
edges = [[[1, 1], 0, [0, 0]], [[2, 3], 1.5707963267948966, [4, -5]]]

[[function]]
name = "from_angle_translation"
call = "Affine2Trait::from_angle_translation({0}, {1})"
args = [{ type = "Fixed", domain = "angle" }, { type = "Vec2", min = -8.0, max = 8.0 }]
ret = "Affine2"
cases = 8
tolerance = 3
justification = "sine/cosine are within about 1 ULP plus oracle quantization; translation is exact: |diff| <= 3."
edges = [[0, [0, 0]], [1.5707963267948966, [4, -5]], [-1.5707963267948966, [-2, 3]]]

[[function]]
name = "to_scale_angle_translation"
call = "{0}.to_scale_angle_translation()"
args = [{ type = "Affine2", constraint = "trs", scale_min = 0.5, scale_max = 8.0 }]
ret = "(Vec2, Fixed, Vec2)"
cases = 10
tolerance = 5
justification = "each scale component is an integer-square-root floor (at most 1 ULP below exact); the angle uses `atan2` (3.22 ULP) and the oracle quantization adds at most 0.5 ULP, so the shared tuple bound is 5."
edges = [[[[1, 0], [0, 1], [3, -2]]], [[[-2, 0], [0, 3], [4, -5]]]]

[[function]]
name = "mul_mat3"
call = "{0}.mul_mat3({1})"
args = [{ type = "Affine2", min = -100.0, max = 100.0 }, { type = "Mat3", min = -100.0, max = 100.0 }]
ret = "Mat3"
cases = 8
tolerance = 1
justification = "embedding is exact and every output element uses one `dot3` fused kernel, flooring the exact sum once vs round to nearest: |diff| <= 1."
edges = [[[[1, 0], [0, 1], [0, 0]], [[1, 0, 0], [0, 1, 0], [0, 0, 1]]]]
