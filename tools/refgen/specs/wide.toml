args = [{ type = "Fixed", domain = "full" }, { type = "Fixed", domain = "full" }]
ret = "(Fixed, Fixed)"
cases = 4
tolerance = 0
justification = "exact: r = floor(2^96 / floor(sqrt(sum of squares))), then round((x * r) / 2^64) per component (ties toward +infinity); axis-aligned vectors give exactly +-1."
edges = [[3, 4], [-7, 0], ["raw:1", 0], ["raw:0x7fffffffffffffff", "raw:0x7fffffffffffffff"]]

[[function.panics]]
