# Golden vectors of `fixed::wide` (fused kernels).
# Oracles: tools/refgen/src/oracles/wide.rs. Format: tools/refgen/README.md.
# Regenerate: cargo run --manifest-path tools/refgen/Cargo.toml -- gen wide
#
# Integer oracles, tolerance 0 everywhere: a fused kernel sums the exact raw products and rescales
# once, so the result is exactly floor(sum / 2^32) (docs/DESIGN.md section 2.1); norms and distances
# are the floor of the exact root of the raw Q64.64 sum; `RecipTrait::mul` rounds to nearest, ties
# toward +infinity, through the truncated 96-bit reciprocal; `FixedTrait::div_nearest` /
# `recip_nearest` and `RecipNearestTrait::div_nearest` are the exact quotient rounded half to even
# (checked together, as a pair: the golden file of `fixed` is at its line cap). Sums that leave
# the scalar range are panic cases with the exact message of the implementation.
#
# The kernels take their arguments flat, so the arguments are plain `Fixed` values (no vector types
# in the `fixed` package). The generated file is capped at 1 500 lines: a few random cases per
# function, edges for the boundaries. Domains: |x| <= 1000 for the sums of products (the result
# fits whatever the signs), whole range for the norms, distances and `normalize`, whose result
# fits for most draws.

module = "wide"
package = "fixed"
imports = [
    "fixed::FixedTrait", "fixed::ONE", "fixed::wide", "fixed::wide::RecipNearestTrait as RN",
    "fixed::wide::RecipTrait",
]

# ------------------------------------------------------------------------------------------
# Sums of products: one rescale, floor.
# ------------------------------------------------------------------------------------------

[[function]]
name = "dot2"
call = "wide::dot2({0}, {1}, {2}, {3})"
args = [{ type = "Fixed" }, { type = "Fixed" }, { type = "Fixed" }, { type = "Fixed" }]
ret = "Fixed"
cases = 4
tolerance = 0
justification = "exact: floor((a0 * b0 + a1 * b1) / 2^32), a single floor rescale."
edges = [
    [1, 2, 3, 4],
    [1.5, -2, 0.25, 4],
    ["raw:0x7fffffffffffffff", 1, 0, 0],
    ["raw:0x7fffffffffffffff", "raw:0x7fffffffffffffff", "raw:-0x8000000000000000", "raw:0x7fffffffffffffff"],
]

[[function.panics]]
name = "overflow"
args = ["raw:0x7fffffffffffffff", "raw:0x7fffffffffffffff", 0, 0]
expected = "Fixed: overflow"

