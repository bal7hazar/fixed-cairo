# ------------------------------------------------------------------------------------------
# Recip: x / d rounded to nearest through a 96-bit reciprocal.
# ------------------------------------------------------------------------------------------

[[function]]
name = "recip_mul"
call = "RecipTrait::new({0}).mul({1})"
args = [{ type = "Fixed", domain = "full", nonzero = true }, { type = "Fixed", domain = "full" }]
ret = "Fixed"
cases = 6
tolerance = 0
justification = "exact: r = trunc(2^96 / d), then floor((x * r + 2^63) / 2^64), round to nearest, ties toward +infinity."
edges = [[3, 6], [3, 1], [-3, 6], [1, "raw:0x7fffffffffffffff"], [7, -13], ["raw:3", "raw:-1"]]

[[function.panics]]
name = "division_by_zero"
args = [0, 1]
expected = "Fixed: division by zero"

[[function.panics]]
name = "overflow"
args = ["raw:1", "raw:0x7fffffffffffffff"]
expected = "Fixed: overflow"

[[function]]
name = "recip_mul_ideal"
oracle = "recip_mul_ideal"
call = "RecipTrait::new({0}).mul({1})"
args = [{ type = "Fixed", domain = "full", nonzero = true }, { type = "Fixed", domain = "full" }]
ret = "Fixed"
cases = 6
tolerance = 1
justification = "accuracy claim: the result is within 1/2 + |x| / 2^64 < 1 ULP of the exact quotient x / d, hence at most 1 ULP from that quotient rounded to nearest."
edges = [[3, 1], [7, -13], [1, "raw:0x7fffffffffffffff"], ["raw:3", "raw:-1"]]

# ------------------------------------------------------------------------------------------
# Correctly rounded division: FixedTrait::div_nearest / recip_nearest and RecipNearest, checked
# together as a pair (same exact value by contract).
# ------------------------------------------------------------------------------------------

[[function]]
name = "div_nearest"
call = "({0}.div_nearest({1}), RN::new({1}).div_nearest({0}))"
args = [{ type = "Fixed", domain = "full" }, { type = "Fixed", domain = "full", nonzero = true }]
ret = "(Fixed, Fixed)"
cases = 6
tolerance = 0
justification = "exact: round_half_even(x * 2^32 / d) on the exact rational (i128), for both forms."
edges = [
    # ties 2 |r| == |d|, all four sign pairs, even (0, -0) and odd (1, -1) truncated quotients
    ["raw:1", 2],
    ["raw:3", 2],
    ["raw:-1", 2],
    ["raw:-3", 2],
    ["raw:1", -2],
    ["raw:3", -2],
    ["raw:-1", -2],
    ["raw:-3", -2],
    ["raw:9", 6],
    ["raw:-15", 6],
    ["raw:0x7fffffffffffffff", 2],
    ["raw:-0x7fffffffffffffff", -2],
    # exact quotients
    [7.5, -2.5],
    [-6, 3],
    [0, "raw:-1"],
    # extremes and the overflow boundary
    ["raw:0x7fffffffffffffff", 1],
    ["raw:-0x8000000000000000", 1],
