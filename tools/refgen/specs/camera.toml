justification = "as `Mat4::look_at_rh`: plus the `normalize` of `center - eye` (length >= 1): <= 25 ULP on `s` and `u`, 3 * 8 * 25 + 1 = 601 ULP on the last column, rounded up (`specs/mat4.toml`)."

