# Golden vectors of `glam::camera`, with glam-rs 0.33.8 `glam::dcamera` (f64) as the oracle.
# Oracles: tools/refgen/src/oracles/camera.rs. Format: tools/refgen/README.md.
# Regenerate: cargo run --manifest-path tools/refgen/Cargo.toml -- gen camera
#
# Tolerances (raw ULP, the Cairo side truncates / floors, the oracle rounds to nearest):
#
# * `perspective*`: `yy = cot(fov / 2)` is one `sin_cos` (<= 1.02 ULP, 0.86 for cos), the half angle
#   `fov * 0.5` floors (<= 1 ULP, moving `cot` by `1 + cot^2`) and one truncated division. On
#   `fov` in [1.0, 2.6], `cot <= 1.83` and `sin(fov / 2) >= 0.479`, so `|yy - exact| <=
#   (0.86 + 1.83 * 1.02) / 0.479 + (1 + 1.83^2) + 1 = 11.1`, and `xx = yy / aspect` (aspect >= 0.5,
#   one truncation) is within `11.1 / 0.5 + 1 = 23.2`: with the oracle's own rounding (0.5), 24.
#   The depth terms are those of `frustum` below (<= 17); `zz`, `zw` and `tz` of the infinite ones
#   are exact.
# * `frustum`: `xx`, `yy`, `zx`, `zy` are `Recip` quotients rounded to nearest: 1 ULP. Depth:
#   `q = far / (far - near)` truncated (error < 1 ULP), `zz = q` (<= 1 with the oracle's rounding),
#   `zz = 2 q - 1` (<= 2), `tz = floor(-near * q)` (< `near + 1 + 0.5`: 9 for `near <= 8`) and
#   `tz = floor(-2 near q)` (< `2 near + 1 + 0.5`: 17).
# * `orthographic`: every element is one `Recip` quotient rounded to nearest: 1 ULP.
# * `look_*`: the tolerances of the `Mat4::look_*` entries of `specs/mat4.toml` (`Mat4` views are
#   those functions), and the rotation block of them for `Mat3`.
#
# Not covered here: `look_*_affine3` / `look_*_quat` / `*_mat3a` / `*_affine3a` (not ported, see
# the module docs); the exact structure (zeros, signs, lh / rh and API relations) and the usable
# range are pinned by `tests/test_camera.cairo`.

module = "camera"
package = "glam"
imports = ["glam::camera::lh", "glam::camera::rh"]

[[function]]
name = "lh_opengl_perspective"
call = "lh::proj::opengl::perspective({0}, {1}, {2}, {3})"
args = [{ type = "Fixed", min = 1.0, max = 2.6 }, { type = "Fixed", min = 0.5, max = 4.0 }, { type = "Fixed", min = 0.01, max = 8.0 }, { type = "Fixed", min = 0.02, max = 500.0 }]
ret = "Mat4"
cases = 4
tolerance = 26
justification = "`cot(fov / 2)` (sin_cos, floored half angle, truncated division) and `xx = cot / aspect`: <= 24 ULP on `fov` in [1, 2.6], aspect >= 0.5; depth terms <= 17 (header)."
edges = [
    ["raw:6746518852", 2, 1, 3],
]

[[function]]
name = "lh_opengl_orthographic"
call = "lh::proj::opengl::orthographic({0}, {1}, {2}, {3}, {4}, {5})"
args = [{ type = "Fixed", min = -100.0, max = 100.0 }, { type = "Fixed", min = -100.0, max = 100.0 }, { type = "Fixed", min = -100.0, max = 100.0 }, { type = "Fixed", min = -100.0, max = 100.0 }, { type = "Fixed", min = -100.0, max = 100.0 }, { type = "Fixed", min = -100.0, max = 100.0 }]
ret = "Mat4"
cases = 4
tolerance = 1
justification = "every element is one `Recip` quotient rounded to nearest (or an exact negation) against the oracle rounded to nearest: |diff| <= 1."
edges = [
    [-1, 1, -1, 1, 0, 1],
    [-4, 4, -2, 2, 1, 3],
]

[[function]]
name = "lh_opengl_frustum"
call = "lh::proj::opengl::frustum({0}, {1}, {2}, {3}, {4}, {5})"
args = [{ type = "Fixed", min = -100.0, max = 100.0 }, { type = "Fixed", min = -100.0, max = 100.0 }, { type = "Fixed", min = -100.0, max = 100.0 }, { type = "Fixed", min = -100.0, max = 100.0 }, { type = "Fixed", min = 0.01, max = 8.0 }, { type = "Fixed", min = 0.02, max = 500.0 }]
ret = "Mat4"
cases = 4
tolerance = 17
justification = "`xx`, `yy`, `zx`, `zy`: `Recip` quotients, 1 ULP; `zz = 2 q - 1` 2 ULP and `tz = floor(-2 near q)` < `2 near + 1.5` (near <= 8): 17 (header)."
edges = [
    [-2, 2, -1, 1, 1, 3],
]

