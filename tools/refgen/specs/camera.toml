call = "lh::view::look_to_mat4({0}, {1}, {2})"
args = [{ type = "Vec3", min = -8.0, max = 8.0 }, { type = "Vec3", constraint = "normalized" }, { type = "Vec3", constraint = "normalized" }]
ret = "Mat4"
cases = 3
tolerance = 256
justification = "as `Mat4::look_to_rh`: the oracle keeps |dir x up| >= 1/2, <= 4 ULP on `s`, <= 9 on `u`, and the last column is `-eye . s` with |eye| <= 8: 3 * 8 * 9 + 1 = 217 ULP, rounded up (`specs/mat4.toml`)."

