[[function.panics]]
name = "division_by_zero"
args = [1, 3, 3, 0, 1]
expected = "Fixed: division by zero"

[[function]]
name = "powi"
call = "{0}.powi({1})"
args = [{ type = "Fixed", domain = "small" }, { type = "i32", min = -5, max = 5 }]
ret = "Fixed"
cases = 6
tolerance = 0
justification = "exact: the documented algorithm, every product floored (n = 2, 3 floor of the exact power, n = 4 floor(floor(x^2)^2), n >= 5 binary exponentiation LSB first), negative n = recip (rounded half to even) of the power."
edges = [
    [2, 0],
    [-3, 3],
    [1.5, 4],
    [-1.5, 5],
    [2, -2],
    [0.5, -3],
    ["raw:3", -1],
    [1.1, 7],
    ["raw:1", 2],
]

[[function.panics]]
name = "overflow"
args = [100, 5]
expected = "Fixed: overflow"

[[function.panics]]
name = "negative_of_zero"
args = ["raw:1", -2]
expected = "Fixed: division by zero"

[[function]]
name = "smoothstep"
call = "{0}.smoothstep({1}, {2})"
args = [
    { type = "Fixed", domain = "small" },
    { type = "Fixed", domain = "small" },
    { type = "Fixed", domain = "small" },
]
ret = "Fixed"
cases = 6
tolerance = 0
justification = "exact: t = saturate(round_half_even((x - e0) / (e1 - e0))), then floor(t^2 (3 - 2t)) evaluated at the Q96.96 scale."
edges = [[0.5, 0, 1], [-1, 0, 1], [2, 0, 1], [0.25, 0, 1], [5, 10, 0], ["raw:1", 0, 1], [1.5, -2, 6]]

[[function.panics]]
name = "equal_edges"
args = [0.5, 1, 1]
expected = "Fixed: division by zero"

[[function.panics]]
name = "quotient_overflow"
args = [2, 0, "raw:1"]
expected = "Fixed: overflow"

[[function]]
name = "move_towards"
call = "{0}.move_towards({1}, {2})"
args = ["Fixed", "Fixed", { type = "Fixed", min = -50.0, max = 2000.0 }]
ret = "Fixed"
cases = 6
tolerance = 0
justification = "exact: rhs when |rhs - self| <= d, else self moved by d toward rhs; a negative d moves away, a zero gap counts as positive."
edges = [
    [0, 10, 3],
    [0, -10, 3],
    [0, 1, 3],
    [0, 10, -1],
    [5, 5, -1],
    [5, 5, 0],
    ["raw:1", "raw:2", "raw:1"],
]

[[function.panics]]
name = "gap_overflow"
args = [-1, "raw:0x7fffffffffffffff", 1]
expected = "i64_sub Overflow"

[[function.panics]]
name = "min_step"
args = [0, -1, "raw:-0x8000000000000000"]
expected = "i64_neg Underflow"

[[function.panics]]
name = "away_underflow"
args = ["raw:-0x8000000000000000", "raw:-0x8000000000000000", -1]
expected = "i64_add Underflow"

# ------------------------------------------------------------------------------------------
# Euclidean division: exact on the raw integers.
# ------------------------------------------------------------------------------------------

[[function]]
name = "euclid"
call = "({0}.div_euclid({1}), {0}.rem_euclid({1}))"
args = [{ type = "Fixed", domain = "full" }, { type = "Fixed", domain = "full", nonzero = true }]
ret = "(Fixed, Fixed)"
cases = 6
tolerance = 0
justification = "exact: (q * 2^32, r) with raw a = q * raw b + r and 0 <= r < |raw b|; quotients outside the scalar range are panic cases."
edges = [
    [7, 4],
    [-7, 4],
    [7, -4],
    [-7.5, -2],
    ["raw:-1", 2],
    ["raw:-0x8000000000000000", "raw:0x7fffffffffffffff"],
    ["raw:0x7fffffffffffffff", "raw:-0x8000000000000000"],
]

[[function.panics]]
name = "division_by_zero"
args = [1, 0]
expected = "Fixed: division by zero"

[[function.panics]]
name = "overflow"
args = ["raw:0x4000000000000000", "raw:1"]
expected = "Fixed: overflow"

