# ------------------------------------------------------------------------------------------

[[function]]
name = "abs"
call = "{0}.abs()"
args = [{ type = "Fixed", domain = "full" }]
ret = "Fixed"
cases = 4
tolerance = 0
justification = "exact: |raw|; only MIN overflows."
edges = [[0], [-1.5], ["raw:-1"], ["raw:-0x7fffffffffffffff"]]

[[function.panics]]
name = "min"
args = ["raw:-0x8000000000000000"]
expected = "Fixed: overflow"

[[function]]
name = "signum"
