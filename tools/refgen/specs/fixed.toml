args = [{ type = "Fixed", domain = "full" }]
ret = "Fixed"
cases = 4
tolerance = 0
justification = "exact: -1 or +1, signum(0) = +1 like f32::signum(+0.0) (DESIGN section 3)."
edges = [[0], ["raw:1"], ["raw:-1"], ["raw:-0x8000000000000000"]]

[[function]]
name = "copysign"
call = "{0}.copysign({1})"
args = [{ type = "Fixed", domain = "full" }, { type = "Fixed", domain = "full" }]
ret = "Fixed"
cases = 4
tolerance = 0
justification = "exact: |self| with the sign of the argument, a zero argument counts as positive."
edges = [[1.5, -2], [-1.5, 2], [-1.5, 0], [0, -1], ["raw:-0x8000000000000000", -1]]

[[function.panics]]
name = "min_zero_sign"
