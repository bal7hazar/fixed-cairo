[[function]]
name = "mul"
enabled = false
call = "{0} * {1}"
args = ["Fixed", "Fixed"]
ret = "Fixed"
cases = 48
tolerance = 1
justification = "one floor rescale on the Cairo side vs the real product rounded to nearest: |diff| <= 1."
edges = [
    [0, 5],
    [1, 1],
    [-1, 1],
    [1.5, -2.5],
    ["raw:1", "raw:1"],
    ["raw:-1", "raw:1"],
    ["raw:0x80000000", "raw:1"],
    ["raw:-0x80000000", "raw:1"],
    [46340.5, 46340.5],
    [-46341, 46340],
    [0.0000152587890625, 0.0000152587890625],
]

[[function]]
name = "div"
enabled = false
call = "{0} / {1}"
args = ["Fixed", { type = "Fixed", nonzero = true }]
ret = "Fixed"
cases = 48
tolerance = 1
justification = "truncated (or floored) quotient on the Cairo side vs the real quotient rounded to nearest: |diff| <= 1."
edges = [
    [0, 5],
    [1, 1],
    [1, 3],
    [-1, 3],
    [1, -3],
    [-1, -3],
    [7.5, -2.5],
    ["raw:1", 2],
    ["raw:-1", 2],
    [1000, 0.001],
    [2147483647, 1],
]

