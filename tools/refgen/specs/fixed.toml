ret = "Fixed"
cases = 4
tolerance = 0
justification = "exact: 0 if value < edge, else 1 (equal counts as 1)."
edges = [[0, 0], [0, -1], [0, 1], ["raw:1", 0], [0, "raw:-1"]]

