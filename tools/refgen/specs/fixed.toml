cases = 4
tolerance = 0
justification = "exact: (min, max) of the raw values."
edges = [[1, 1], [1, -1], ["raw:1", "raw:2"], ["raw:-0x8000000000000000", "raw:0x7fffffffffffffff"]]

[[function]]
name = "clamp"
call = "{0}.clamp({1}, {2})"
args = [
    { type = "Fixed", domain = "full" },
    { type = "Fixed", domain = "full" },
    { type = "Fixed", domain = "full" },
]
ret = "Fixed"
cases = 6
tolerance = 0
justification = "exact. Cases with min > max (a glam precondition) are skipped by the oracle."
edges = [
    [5, -1, 1],
    [-5, -1, 1],
    [0, -1, 1],
    [1, 1, 1],
    ["raw:0x7fffffffffffffff", "raw:-0x8000000000000000", 0],
]

[[function]]
name = "saturate"
call = "{0}.saturate()"
args = [{ type = "Fixed", domain = "small" }]
ret = "Fixed"
