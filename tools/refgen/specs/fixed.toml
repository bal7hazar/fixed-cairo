# Golden vectors of `fixed::fixed` (scalar tier A).
# Oracles: tools/refgen/src/oracles/fixed.rs. Format: tools/refgen/README.md.
# Regenerate: cargo run --manifest-path tools/refgen/Cargo.toml -- gen fixed
#
# Every oracle is an exact integer oracle (i128 on the raw values, whole i64 range where the
# operation allows it), so every tolerance is 0: the result of each function is exactly defined by
# the rounding rules of docs/DESIGN.md section 2 (`*`, `mul_add`, `lerp` floor; `/`, `recip`,
# `from_ratio` round to nearest, ties to even, like `f64 /`; `%` is the exact remainder of the
# truncated division; `round` half away from zero; `sqrt` floor of the exact root).
# Panic paths carry the exact message of the implementation.
#
# The generated file is capped at 1 500 lines (the CI runner kills compiles of huge test crates),
# hence a handful of random cases per function, and total functions of the same arguments checked
# together as a tuple: `to_int_pair` = (to_int, to_int_trunc), `div_rem` = (/, %), `euclid` =
# (div_euclid, rem_euclid), `min_max`, `floor_trunc`, `fract_pair` = (fract, fract_gl) and `cmp` =
# (lt, le, gt, ge). The random inputs mostly sit on the whole i64 range (`domain = "full"`) and
# the sampler right-shifts half of the draws, so small and large magnitudes are both drawn.

module = "fixed"
package = "fixed"
imports = ["fixed::FixedTrait"]

# ------------------------------------------------------------------------------------------
# Constructors and conversions.
# ------------------------------------------------------------------------------------------

[[function]]
name = "from_raw"
call = "FixedTrait::from_raw({0})"
args = [{ type = "i64", min = -9007199254740992, max = 9007199254740992 }]
ret = "Fixed"
cases = 2
tolerance = 0
justification = "exact: the raw value is stored as is."
edges = [[0], [-1], ["raw:0x7fffffffffffffff"], ["raw:-0x8000000000000000"]]

[[function]]
name = "from_int"
call = "FixedTrait::from_int({0})"
args = [{ type = "i32", min = -2147483648, max = 2147483647 }]
ret = "Fixed"
cases = 4
tolerance = 0
justification = "exact: raw = v * 2^32, every i32 is representable."
edges = [[0], [1], [-1], [2147483647], [-2147483648]]

[[function]]
name = "from_ratio"
call = "FixedTrait::from_ratio({0}, {1})"
args = [
    { type = "i64", min = -10000000000, max = 10000000000 },
    { type = "i64", min = -1000, max = 1000 },
]
ret = "Fixed"
cases = 6
tolerance = 0
justification = "exact: round_half_even(num * 2^32 / den) on plain integers; results outside the scalar range are panic cases."
edges = [[1, 3], [-1, 3], [1, -3], [-1, -3], [7, 2], [2147483647, 1], [-2147483648, 1]]

[[function.panics]]
name = "division_by_zero"
args = [1, 0]
expected = "Fixed: division by zero"

[[function.panics]]
name = "overflow"
args = [2147483648, 1]
expected = "Fixed: overflow"

[[function]]
name = "to_int_pair"
call = "({0}.to_int(), {0}.to_int_trunc())"
args = [{ type = "Fixed", domain = "full" }]
ret = "(i32, i32)"
cases = 4
tolerance = 0
justification = "exact: (floor(raw / 2^32), trunc(raw / 2^32)), toward negative infinity and toward zero, never fail."
edges = [
    [0],
    [1.5],
    [-1.5],
    [-0.5],
    ["raw:-1"],
    ["raw:0x7fffffffffffffff"],
    ["raw:-0x8000000000000000"],
]

[[function]]
name = "to_int_round"
call = "{0}.to_int_round()"
args = [{ type = "Fixed", domain = "full" }]
ret = "i32"
cases = 4
tolerance = 0
justification = "exact: nearest integer, ties away from zero; only >= 2^31 - 1/2 overflows."
edges = [
    [0.5],
    [-0.5],
    [2.5],
    [-2.5],
    ["raw:0x7fffffff"],
    ["raw:0x7fffffff7fffffff"],
    ["raw:-0x8000000000000000"],
]

[[function.panics]]
name = "half_below_max_int"
args = ["raw:0x7fffffff80000000"]
expected = "Fixed: overflow"

# ------------------------------------------------------------------------------------------
# Native operators: checked i64 on the raw values.
# ------------------------------------------------------------------------------------------

[[function]]
name = "add"
call = "{0} + {1}"
args = [{ type = "Fixed", domain = "full" }, { type = "Fixed", domain = "full" }]
ret = "Fixed"
cases = 6
tolerance = 0
justification = "exact: native i64 addition of the raw values (integer oracle, full range)."
edges = [
    [1.5, -1.5],
    ["raw:1", "raw:-1"],
    ["raw:0x7ffffffffffffffe", "raw:1"],
    ["raw:-0x8000000000000000", 0],
    ["raw:-0x8000000000000000", "raw:0x7fffffffffffffff"],
]

[[function.panics]]
name = "overflow"
args = ["raw:0x7fffffffffffffff", "raw:1"]
expected = "i64_add Overflow"

[[function.panics]]
name = "underflow"
args = ["raw:-0x8000000000000000", "raw:-1"]
expected = "i64_add Underflow"

[[function]]
name = "sub"
call = "{0} - {1}"
args = [{ type = "Fixed", domain = "full" }, { type = "Fixed", domain = "full" }]
ret = "Fixed"
cases = 6
tolerance = 0
justification = "exact: native i64 subtraction of the raw values (integer oracle, full range)."
edges = [
    [1.5, 1.5],
    ["raw:1", "raw:-1"],
    ["raw:0x7fffffffffffffff", 0],
    ["raw:-0x8000000000000000", "raw:-0x8000000000000000"],
    ["raw:-1", "raw:0x7fffffffffffffff"],
]

[[function.panics]]
name = "overflow"
args = ["raw:0x7fffffffffffffff", "raw:-1"]
expected = "i64_sub Overflow"

[[function.panics]]
name = "underflow"
args = ["raw:-0x8000000000000000", "raw:1"]
expected = "i64_sub Underflow"

[[function]]
name = "neg"
call = "-{0}"
args = [{ type = "Fixed", domain = "full" }]
ret = "Fixed"
cases = 4
tolerance = 0
justification = "exact: native i64 negation of the raw value (integer oracle, full range)."
edges = [[0], ["raw:1"], ["raw:0x7fffffffffffffff"], ["raw:-0x7fffffffffffffff"]]

[[function.panics]]
name = "min"
args = ["raw:-0x8000000000000000"]
expected = "i64_neg Underflow"

# ------------------------------------------------------------------------------------------
# Rescaling operators.
# ------------------------------------------------------------------------------------------

[[function]]
name = "mul"
call = "{0} * {1}"
args = [{ type = "Fixed", domain = "full" }, { type = "Fixed", domain = "full" }]
ret = "Fixed"
cases = 6
tolerance = 0
justification = "exact: floor(a * b / 2^32), one floor rescale (products outside the scalar range are panic cases)."
edges = [
    [1.5, -2.5],
    ["raw:-1", "raw:1"],
    ["raw:0x80000000", "raw:1"],
    [46340.5, 46340.5],
    ["raw:0x7fffffffffffffff", 1],
    ["raw:-0x8000000000000000", 0.5],
]

[[function.panics]]
name = "overflow"
args = ["raw:-0x8000000000000000", -1]
expected = "Fixed: overflow"

[[function]]
name = "div_rem"
call = "({0} / {1}, {0} % {1})"
args = [{ type = "Fixed", domain = "full" }, { type = "Fixed", domain = "full", nonzero = true }]
ret = "(Fixed, Fixed)"
cases = 6
tolerance = 0
justification = "exact: (round_half_even(a * 2^32 / b), a % b): the quotient to nearest, ties to even; the remainder is that of the truncated division (sign of the dividend); quotients outside the scalar range are panic cases."
edges = [
    [7.5, -2.5],
    [-7.5, 2],
    [1, 3],
    ["raw:-1", 2],
    ["raw:-0x8000000000000000", "raw:0x7fffffffffffffff"],
    ["raw:-0x8000000000000000", "raw:-0x8000000000000000"],
]

[[function.panics]]
name = "division_by_zero"
args = [1, 0]
expected = "Fixed: division by zero"

[[function.panics]]
name = "overflow"
args = ["raw:0x7fffffffffffffff", 0.5]
expected = "Fixed: overflow"

[[function]]
name = "recip"
call = "{0}.recip()"
args = [{ type = "Fixed", domain = "full", nonzero = true }]
ret = "Fixed"
cases = 4
tolerance = 0
justification = "exact: round_half_even(2^64 / raw) (raw -1, 0, 1 and 2 are panic cases; never a tie)."
edges = [[1], [-3], [0.5], ["raw:3"], ["raw:-2"], ["raw:0x7fffffffffffffff"]]

[[function.panics]]
name = "division_by_zero"
args = [0]
expected = "Fixed: division by zero"

[[function.panics]]
name = "overflow"
args = ["raw:2"]
expected = "Fixed: overflow"

[[function]]
name = "mul_add"
call = "{0}.mul_add({1}, {2})"
args = [
    { type = "Fixed", domain = "full" },
    { type = "Fixed", domain = "full" },
    { type = "Fixed", domain = "full" },
]
ret = "Fixed"
cases = 6
tolerance = 0
justification = "exact: floor((a * b + c * 2^32) / 2^32), a single floor rescale (results outside the scalar range are panic cases)."
edges = [
    [2, 3, 4],
    [1.5, 1.5, -2.25],
    ["raw:-1", "raw:1", 0],
    ["raw:0x7fffffffffffffff", 1, 0],
    [-1000, -1000, 1000000],
    [46340, 46340, 0.5],
]

[[function.panics]]
name = "overflow"
args = ["raw:0x7fffffffffffffff", 2, 0]
expected = "Fixed: overflow"

[[function]]
name = "lerp"
call = "{0}.lerp({1}, {2})"
args = ["Fixed", "Fixed", { type = "Fixed", min = -1.0, max = 2.0 }]
ret = "Fixed"
cases = 6
tolerance = 0
justification = "exact: floor((a * 2^32 + (b - a) * t) / 2^32), b - a exact, a single floor rescale."
edges = [
    [0, 10, 0],
    [0, 10, 1],
    [10, -10, 0.75],
    ["raw:-0x8000000000000000", "raw:0x7fffffffffffffff", 0.5],
    ["raw:0x7fffffffffffffff", "raw:-0x8000000000000000", 1],
    ["raw:1", "raw:2", "raw:1"],
]

[[function.panics]]
name = "overflow"
args = ["raw:0x7fffffffffffffff", "raw:-0x8000000000000000", 2]
expected = "Fixed: overflow"

[[function]]
name = "inverse_lerp"
call = "FixedTrait::inverse_lerp({0}, {1}, {2})"
args = [
    { type = "Fixed", domain = "small" },
    { type = "Fixed", domain = "small" },
    { type = "Fixed", domain = "small" },
]
ret = "Fixed"
cases = 6
tolerance = 0
justification = "exact: round_half_even((v - a) * 2^32 / (b - a)); the native subtractions and the quotient range are panic cases."
edges = [[0, 10, 5], [0, 10, 10], [10, 0, 2.5], [-1, 1, 0], [1, 3, 2.5]]

[[function.panics]]
name = "division_by_zero"
args = [1, 1, 0.5]
expected = "Fixed: division by zero"

[[function.panics]]
name = "sub_overflow"
args = [-1, 2, "raw:0x7fffffffffffffff"]
expected = "i64_sub Overflow"

[[function.panics]]
name = "quotient_overflow"
args = [0, "raw:1", 1]
expected = "Fixed: overflow"

[[function]]
name = "remap"
call = "{0}.remap({1}, {2}, {3}, {4})"
args = [
    { type = "Fixed", domain = "small" },
    { type = "Fixed", domain = "small" },
    { type = "Fixed", domain = "small" },
    { type = "Fixed", domain = "small" },
    { type = "Fixed", domain = "small" },
]
ret = "Fixed"
cases = 4
tolerance = 0
justification = "exact: out_start.lerp(out_end, inverse_lerp(in_start, in_end, x)), both stages with their own rounding."
