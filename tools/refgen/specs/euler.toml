# Golden vectors of `glam::euler`, with glam-rs 0.33.8 `DQuat`, `DMat3` and `DMat4` as the
# oracle. Oracles: tools/refgen/src/oracles/euler.rs. Format: tools/refgen/README.md.
# Regenerate: cargo run --manifest-path tools/refgen/Cargo.toml -- gen euler
#
# `EulerRot` is not a refgen argument type (it is an enum, not a bundle of `Fixed` leaves), so
# the order is part of the `call` expression and every group below is one entry per order.
#
# Coverage. `mat3_from_euler_*` covers the 24 orders and is what pins the 24-arm `decode` table
# and the six-arm `from_ijk` of `glam::euler` against glam-rs. `decode` is shared by every
# entry point, so the other groups only have to cover their own branches: `to_euler_*` takes
# the twelve orders that hit the six axis permutations of `to_ijk` times the repeated and the
# non-repeated branch, with both frames represented, and `quat_*` a smaller subset of the same
# shape. The orders left out of those groups are covered in `tests/test_euler.cairo`, for all
# 24 of them, by the two identities of glam-rs' own test suite: `from_euler(order, a, b, c)` is
# the composition of the three axis rotations, and `from_euler(order, to_euler(m)) == m`.
# `Mat4` is a lossless embedding of the `Mat3` result (`from_mat3` / `from_mat4` only move
# scalars around), checked exactly for the 24 orders in `tests/test_euler.cairo`; one order is
# pinned here as a smoke test of the delegation. The file is kept under the 1 500-line budget
# of the repository (compile memory on the CI runners).
#
# Tolerances. Every entry states its own derivation; the two families are the `sin_cos` chain of
# `from_euler` (8 raw ULP) and the `atan2` of `to_euler` (5 ULP on an exact matrix, 24 ULP when
# the matrix itself comes from a quaternion).
#
# Domains and skips. The angles are the `angle` preset (|x| <= 2 pi): beyond it `sin_cos` loses
# accuracy with the magnitude and the tolerance would have to grow. `to_euler` is skipped near
# gimbal lock, where glam-rs (`16 * f64::EPSILON`) and glam-cairo (`16 * 2^-32`) choose
# different branches, and `quat_to_euler` is skipped below `|cy| = 0.25`, where the 2 ULP of the
# matrix entries are amplified by more than four.

module = "euler"
package = "glam"
imports = [
    "glam::euler::EulerRot",
    "glam::euler::Mat3EulerTrait",
    "glam::euler::Mat4EulerTrait",
    "glam::euler::QuatEulerTrait",
]

[[function]]
name = "mat3_from_euler_zyx"
call = "Mat3EulerTrait::from_euler(EulerRot::ZYX, {0}, {1}, {2})"
args = [{ type = "Fixed", domain = "angle" }, { type = "Fixed", domain = "angle" }, { type = "Fixed", domain = "angle" }]
ret = "Mat3"
cases = 0
tolerance = 8
justification = "5 * 1.02 ULP of `sin_cos` + 1 floor + 0.5 quantization <= 8 (see the header)."
edges = [[0, 0, 0], [0.5, -1.25, 2.0]]

