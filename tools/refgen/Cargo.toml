[package]
name = "refgen"
version = "0.1.0"
edition = "2021"
publish = false
description = "Golden-vector generator of fixed-cairo: f64 and exact integer oracles"
license = "MIT"

# Own workspace: this crate is not part of the scarb workspace and must not be picked up by a
# parent Cargo workspace either.
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "1.1"

[profile.dev]
opt-level = 1
